<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bgPlein" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1216"/><stop offset="1" stop-color="#1c2129"/>
    </linearGradient>
    <marker id="fp-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f5b60d"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="url(#bgPlein)"/>

  <!-- route -->
  <path d="M60 300 C 200 260, 260 180, 360 170 S 520 120, 700 70"
        fill="none" stroke="#2a313c" stroke-width="18" stroke-linecap="round"/>
  <path d="M60 300 C 200 260, 260 180, 360 170 S 520 120, 700 70"
        fill="none" stroke="#f5b60d" stroke-width="4" stroke-dasharray="14 10" marker-end="url(#fp-arrow)"/>

  <!-- depart -->
  <circle cx="60" cy="300" r="10" fill="#f5b60d"/>
  <text x="60" y="330" text-anchor="middle" fill="#e9edf3" font-size="18" font-weight="700">Départ</text>

  <!-- arrivee -->
  <circle cx="700" cy="70" r="10" fill="#2fbd6b"/>
  <text x="700" y="50" text-anchor="middle" fill="#e9edf3" font-size="18" font-weight="700">Arrivée</text>

  <!-- station gagnante -->
  <circle cx="360" cy="170" r="9" fill="#2fbd6b" stroke="#0f1216" stroke-width="2"/>
  <rect x="270" y="195" width="180" height="66" rx="10" fill="#1c2129" stroke="#2fbd6b" stroke-width="2"/>
  <text x="360" y="218" text-anchor="middle" fill="#2fbd6b" font-size="13" font-weight="800">MEILLEURE AFFAIRE</text>
  <text x="360" y="245" text-anchor="middle" fill="#e9edf3" font-size="22" font-weight="800" font-family="Consolas, monospace">22.2 L</text>

  <!-- station ecartee -->
  <circle cx="470" cy="128" r="7" fill="#6b7280"/>
  <text x="470" y="112" text-anchor="middle" fill="#8891a0" font-size="13">2.20 €/L, loin</text>

  <title>Où faire le plein — schéma</title>
</svg>
