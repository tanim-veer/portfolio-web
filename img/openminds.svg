<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, Arial, sans-serif">
  <title>OpenMinds — schéma de l'application</title>
  <defs>
    <linearGradient id="om-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b1e"/><stop offset="1" stop-color="#132a2e"/>
    </linearGradient>
  </defs>
  <rect width="760" height="360" fill="url(#om-bg)"/>

  <!-- téléphone -->
  <rect x="300" y="24" width="160" height="312" rx="22" fill="#0a1416" stroke="#2c4b50" stroke-width="3"/>
  <rect x="352" y="36" width="56" height="6" rx="3" fill="#2c4b50"/>
  <rect x="314" y="54" width="132" height="30" rx="8" fill="#14b8a6"/>
  <text x="380" y="74" text-anchor="middle" fill="#04201d" font-size="14" font-weight="800">Quiz terminé</text>
  <text x="380" y="130" text-anchor="middle" fill="#e6f4f1" font-size="40" font-weight="800">8 / 10</text>
  <rect x="330" y="146" width="100" height="8" rx="4" fill="#1f3a3e"/>
  <rect x="330" y="146" width="80" height="8" rx="4" fill="#2dd4bf"/>
  <circle cx="380" cy="208" r="30" fill="#f5b60d"/>
  <path d="M366 208 l10 10 l20 -22" fill="none" stroke="#3a2a00" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="380" y="262" text-anchor="middle" fill="#f5d77a" font-size="14" font-weight="700">Badge obtenu</text>
  <rect x="322" y="284" width="116" height="30" rx="15" fill="none" stroke="#2dd4bf" stroke-width="2"/>
  <text x="380" y="304" text-anchor="middle" fill="#2dd4bf" font-size="13" font-weight="700">Mon parcours</text>

  <!-- rôles -->
  <g font-size="15" font-weight="700">
    <rect x="40" y="70" width="190" height="52" rx="12" fill="#10272a" stroke="#2dd4bf" stroke-width="2"/>
    <text x="135" y="92" text-anchor="middle" fill="#e6f4f1">Bénévole</text>
    <text x="135" y="112" text-anchor="middle" fill="#8fb8b2" font-size="12" font-weight="400">formations · quiz · badges</text>

    <rect x="40" y="154" width="190" height="52" rx="12" fill="#10272a" stroke="#5b8f89" stroke-width="2"/>
    <text x="135" y="176" text-anchor="middle" fill="#e6f4f1">Formateur</text>
    <text x="135" y="196" text-anchor="middle" fill="#8fb8b2" font-size="12" font-weight="400">sessions · participants</text>

    <rect x="40" y="238" width="190" height="52" rx="12" fill="#10272a" stroke="#5b8f89" stroke-width="2"/>
    <text x="135" y="260" text-anchor="middle" fill="#e6f4f1">Admin</text>
    <text x="135" y="280" text-anchor="middle" fill="#8fb8b2" font-size="12" font-weight="400">certifications · stats</text>
  </g>
  <g stroke="#2c4b50" stroke-width="2" fill="none">
    <path d="M230 96 H300"/><path d="M230 180 H300"/><path d="M230 264 H300"/>
  </g>

  <!-- Firebase -->
  <rect x="530" y="140" width="190" height="80" rx="14" fill="#10272a" stroke="#f59e0b" stroke-width="2"/>
  <text x="625" y="172" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="800">Firebase</text>
  <text x="625" y="196" text-anchor="middle" fill="#c9b27a" font-size="12">Auth · Firestore · Messaging</text>
  <path d="M460 180 H530" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 6"/>
</svg>
