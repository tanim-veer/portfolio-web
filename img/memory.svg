<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, Arial, sans-serif">
  <title>Jeu de Memory — schéma du plateau</title>
  <defs>
    <linearGradient id="mem-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1033"/><stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
    <symbol id="mem-dos" viewBox="0 0 92 64">
      <rect width="92" height="64" rx="10" fill="#243049" stroke="#34436a" stroke-width="2"/>
      <text x="46" y="43" text-anchor="middle" fill="#6b7fb0" font-size="28" font-weight="700">?</text>
    </symbol>
    <symbol id="mem-face" viewBox="0 0 92 64">
      <rect width="92" height="64" rx="10" fill="#f8fafc"/>
    </symbol>
    <path id="mem-etoile" d="M0 -17 L5 -6 L17 -5 L8 3 L10 15 L0 9 L-10 15 L-8 3 L-17 -5 L-5 -6 Z"/>
    <path id="mem-coeur" d="M0 14 C-16 3 -16 -12 -6 -12 C-2 -12 0 -9 0 -7 C0 -9 2 -12 6 -12 C16 -12 16 3 0 14 Z"/>
  </defs>
  <rect width="760" height="360" fill="url(#mem-bg)"/>

  <!-- fenêtre de l'application -->
  <rect x="40" y="18" width="680" height="324" rx="12" fill="#0f172a" stroke="#2a3552" stroke-width="2"/>
  <rect x="40" y="18" width="680" height="32" rx="12" fill="#1e2740"/>
  <rect x="40" y="38" width="680" height="12" fill="#1e2740"/>
  <text x="58" y="39" fill="#cbd5e1" font-size="14" font-weight="600">Jeu de Memory</text>
  <g fill="#8a94a6" font-size="14"><text x="662" y="39">—</text><text x="690" y="39">✕</text></g>

  <!-- barre d'informations -->
  <text x="69" y="80" fill="#e2e8f0" font-size="15"><tspan font-weight="700">Joueur :</tspan> Ethan</text>
  <text x="230" y="80" fill="#e2e8f0" font-size="15"><tspan font-weight="700">Temps restant :</tspan> <tspan fill="#fbbf24" font-weight="700">0:18</tspan></text>
  <text x="440" y="80" fill="#e2e8f0" font-size="15"><tspan font-weight="700">Paires :</tspan> 2 / 9</text>
  <rect x="590" y="62" width="62" height="26" rx="7" fill="#3b82f6"/>
  <text x="621" y="80" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Indice</text>
  <rect x="660" y="62" width="44" height="26" rx="7" fill="none" stroke="#475569"/>
  <text x="682" y="80" text-anchor="middle" fill="#cbd5e1" font-size="13">❚❚</text>

  <!-- plateau : 3 rangées de 6 cartes -->
  <g>
    <use href="#mem-dos" x="69" y="104" width="92" height="64"/>
    <use href="#mem-dos" x="175" y="104" width="92" height="64"/>
    <use href="#mem-face" x="281" y="104" width="92" height="64"/>
    <use href="#mem-dos" x="387" y="104" width="92" height="64"/>
    <use href="#mem-dos" x="493" y="104" width="92" height="64"/>
    <use href="#mem-face" x="599" y="104" width="92" height="64"/>

    <use href="#mem-dos" x="69" y="182" width="92" height="64"/>
    <use href="#mem-face" x="175" y="182" width="92" height="64"/>
    <use href="#mem-dos" x="281" y="182" width="92" height="64"/>
    <use href="#mem-dos" x="387" y="182" width="92" height="64"/>
    <use href="#mem-face" x="493" y="182" width="92" height="64"/>
    <use href="#mem-dos" x="599" y="182" width="92" height="64"/>

    <use href="#mem-dos" x="69" y="260" width="92" height="64"/>
    <use href="#mem-dos" x="175" y="260" width="92" height="64"/>
    <use href="#mem-dos" x="281" y="260" width="92" height="64"/>
    <use href="#mem-face" x="387" y="260" width="92" height="64"/>
    <use href="#mem-dos" x="493" y="260" width="92" height="64"/>
    <use href="#mem-dos" x="599" y="260" width="92" height="64"/>
  </g>

  <!-- paire d'étoiles trouvée -->
  <use href="#mem-etoile" x="327" y="137" fill="#f59e0b"/>
  <use href="#mem-etoile" x="539" y="215" fill="#f59e0b"/>
  <rect x="281" y="104" width="92" height="64" rx="10" fill="none" stroke="#22c55e" stroke-width="3"/>
  <rect x="493" y="182" width="92" height="64" rx="10" fill="none" stroke="#22c55e" stroke-width="3"/>

  <!-- paire de cercles trouvée -->
  <circle cx="645" cy="136" r="15" fill="#3b82f6"/>
  <circle cx="221" cy="214" r="15" fill="#3b82f6"/>
  <rect x="599" y="104" width="92" height="64" rx="10" fill="none" stroke="#22c55e" stroke-width="3"/>
  <rect x="175" y="182" width="92" height="64" rx="10" fill="none" stroke="#22c55e" stroke-width="3"/>

  <!-- carte retournée en attente de sa paire -->
  <use href="#mem-coeur" x="433" y="293" fill="#ef4444"/>
  <rect x="387" y="260" width="92" height="64" rx="10" fill="none" stroke="#fbbf24" stroke-width="3"/>
</svg>
