<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, Arial, sans-serif">
  <title>Moteur d'échecs UCI — finale Roi + Tour contre Roi</title>
  <defs>
    <pattern id="uci-cases" width="80" height="80" patternUnits="userSpaceOnUse" x="40" y="20">
      <rect width="80" height="80" fill="#4a5566"/>
      <rect width="40" height="40" fill="#2e3643"/>
      <rect x="40" y="40" width="40" height="40" fill="#2e3643"/>
    </pattern>
    <symbol id="uci-roi" viewBox="-14 -38 28 40" overflow="visible">
      <rect x="-12" y="-6" width="24" height="6" rx="1.5"/>
      <path d="M-10 -6 L-7 -26 H7 L10 -6 Z"/>
      <rect x="-1.8" y="-37" width="3.6" height="12"/>
      <rect x="-6" y="-33" width="12" height="3.6"/>
    </symbol>
    <symbol id="uci-tour" viewBox="-14 -38 28 40" overflow="visible">
      <rect x="-12" y="-6" width="24" height="6" rx="1.5"/>
      <rect x="-8" y="-25" width="16" height="19"/>
      <path d="M-11 -24 V-34 H-6 V-30 H-2 V-34 H2 V-30 H6 V-34 H11 V-24 Z"/>
    </symbol>
    <marker id="uci-fleche" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#f5b60d"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#12161c"/>

  <!-- échiquier : Tour blanche a1 -> a5 (échec), Roi blanc e1, Roi noir e5 -->
  <rect x="40" y="20" width="320" height="320" fill="url(#uci-cases)"/>
  <rect x="40" y="300" width="40" height="40" fill="#f5b60d" opacity="0.3"/>
  <rect x="40" y="140" width="40" height="40" fill="#f5b60d" opacity="0.3"/>
  <path d="M60 296 V190" stroke="#f5b60d" stroke-width="4" marker-end="url(#uci-fleche)"/>
  <use href="#uci-tour" x="46" y="143" width="28" height="36" fill="#f8fafc" stroke="#0b0f14" stroke-width="1.5"/>
  <use href="#uci-roi" x="206" y="303" width="28" height="36" fill="#f8fafc" stroke="#0b0f14" stroke-width="1.5"/>
  <use href="#uci-roi" x="206" y="143" width="28" height="36" fill="#0b0f14" stroke="#e2e8f0" stroke-width="1.5"/>
  <g fill="#8a94a6" font-size="12">
    <text x="28" y="165" text-anchor="middle">5</text><text x="28" y="325" text-anchor="middle">1</text>
  </g>

  <!-- échange UCI réellement produit par le moteur -->
  <rect x="392" y="50" width="336" height="260" rx="12" fill="#0b0f14" stroke="#2a313c" stroke-width="2"/>
  <text x="414" y="84" fill="#8a94a6" font-size="14" font-weight="700">PROTOCOLE UCI</text>
  <g font-family="Consolas, monospace" font-size="18">
    <text x="414" y="124" fill="#e9edf3">&gt; uci</text>
    <text x="414" y="150" fill="#2fbd6b">uciok</text>
    <text x="414" y="188" fill="#e9edf3">&gt; position fen …</text>
    <text x="436" y="212" fill="#e9edf3">moves a1a5</text>
    <text x="414" y="250" fill="#e9edf3">&gt; go</text>
    <text x="414" y="284" fill="#f5b60d" font-weight="700">bestmove e5e6</text>
  </g>
</svg>
